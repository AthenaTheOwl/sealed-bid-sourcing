# Maps each schema to the files it governs, for
# scripts/validate_data_conformance.py. validate_schemas.py checks the
# schema files themselves; this file is what makes them constrain the
# data they describe.
version: 1
mappings:
  - schema: receipt.schema.json
    files: ["runs/*/receipt.json"]
    records: self
  - schema: internal_audit.schema.json
    files: ["runs/*/internal_audit.json"]
    records: self
  - schema: scenario.schema.json
    files: ["scenarios/*.json"]
    records: self
